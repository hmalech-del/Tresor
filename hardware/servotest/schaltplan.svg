<text x="30" y="630" font-size="15" font-weight="bold" fill="#222">So wird gesteckt</text>
<text x="30" y="654" font-size="13" font-weight="normal" fill="#222">1  orange (Signal) → G18. Litze männlich/weiblich: weiblich auf den Stift, männlich in die Servobuchse.</text>
<text x="30" y="678" font-size="13" font-weight="normal" fill="#222">2  rot (+5V) und braun (GND) des Servos ins Steckbrett – über zwei Litzen männlich/männlich.</text>
<text x="30" y="702" font-size="13" font-weight="normal" fill="#222">3  Board 5V und Board GND ins Steckbrett – zwei Litzen männlich/weiblich (weiblich auf den Stift).</text>
<text x="30" y="726" font-size="13" font-weight="normal" fill="#222">4  Elko ins Steckbrett: langes Bein (+) in die 5V-Reihe, Bein am hellen Streifen (−) in die GND-Reihe.</text>
<text x="30" y="750" font-size="13" font-weight="normal" fill="#222">5  Alles nachzählen, erst dann USB einstecken.</text>
<text x="30" y="774" font-size="13" font-weight="normal" fill="#222"></text>
<text x="30" y="798" font-size="13" font-weight="normal" fill="#222">Ohne Steckbrett: erst ohne Elko testen – orange, rot, braun direkt (3 Litzen männlich/weiblich).</text>
<text x="30" y="822" font-size="13" font-weight="normal" fill="#222">Startet das Board beim Fahren neu (Hilfetext erscheint wieder), fehlt der Elko.</text>
