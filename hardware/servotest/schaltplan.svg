<text x="758" y="358" font-size="11" fill="#333" text-anchor="end">Servostecker auf</text>
<text x="758" y="372" font-size="11" fill="#333" text-anchor="end">3er-Stiftleiste</text>
<circle cx="809.0" cy="476" r="16" fill="#364fc7"/>
<path d="M818.0,463 A16,16 0 0 1 818.0,489 Z" fill="#91a7ff"/>
<line x1="825.0" y1="476" x2="902" y2="476" stroke="#333" stroke-width="1"/>
<text x="906" y="440" font-size="11" fill="#333">Elko 1000 µF</text>
<text x="906" y="455" font-size="11" fill="#555">(von oben)</text>
<text x="906" y="470" font-size="11" fill="#d62828">+ langes Bein:</text>
<text x="906" y="485" font-size="11" fill="#d62828">rote Spalte</text>
<text x="906" y="500" font-size="11" fill="#333">− Streifen:</text>
<text x="906" y="515" font-size="11" fill="#333">braune Spalte</text>
<path d="M296,268 L296,218 L650,218 L650,509 L776,509 L776,498" fill="none" stroke="#f08c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M556,382 L556,520 L798,520 L798,498" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M426,382 L426,531 L820,531 L820,498" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="60" y="422" font-size="12" fill="#444">USB-C rechts: Datenkabel zum Rechner</text>
<text x="30" y="760" font-size="15" font-weight="bold" fill="#222">So wird gesteckt</text>
<text x="30" y="784" font-size="13" font-weight="normal" fill="#222">1  Drei Stifte einer Stiftleiste in die obere Hälfte des Steckbretts, in drei Spalten nebeneinander.</text>
<text x="30" y="808" font-size="13" font-weight="normal" fill="#222">    Den Servostecker draufstecken. Jetzt trägt jede der drei Spalten eine Servofarbe.</text>
<text x="30" y="832" font-size="13" font-weight="normal" fill="#222">2  Board G18 → orange Spalte, Board 5V → rote Spalte, Board GND → braune Spalte</text>
<text x="30" y="856" font-size="13" font-weight="normal" fill="#222">    (3 Litzen männlich/weiblich: weiblich von unten auf den Boardstift, männlich ins Steckbrett).</text>
<text x="30" y="880" font-size="13" font-weight="normal" fill="#222">3  Elko: langes Bein (+) in die rote Spalte, Bein am hellen Streifen (−) in die braune.</text>
<text x="30" y="904" font-size="13" font-weight="normal" fill="#222">4  Alles nachzählen, erst dann USB einstecken.</text>
<text x="30" y="928" font-size="13" font-weight="normal" fill="#222"></text>
<text x="30" y="952" font-size="13" font-weight="normal" fill="#222">Ohne Stiftleiste: drei Litzen männlich/männlich in die Löcher des Servosteckers, die anderen Enden in drei Spalten.</text>
<text x="30" y="976" font-size="13" font-weight="normal" fill="#222">Ohne Steckbrett: erst ohne Elko – drei Litzen männlich/weiblich vom Servostecker direkt an G18, 5V und GND.</text>
</svg>