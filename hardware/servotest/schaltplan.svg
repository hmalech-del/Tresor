<text x="680" y="668" font-size="11" fill="#555">Mini-Steckbrett: die 5 Löcher einer Spalte</text>
<text x="680" y="683" font-size="11" fill="#555">sind verbunden, die beiden Hälften nicht.</text>
<rect x="700" y="100" width="150" height="70" rx="6" fill="#5f3dc4"/>
<circle cx="736" cy="135" r="15" fill="#e5dbff"/>
<text x="800" y="141" font-size="16" fill="#fff" text-anchor="middle">MG90S</text>
<text x="860" y="118" font-size="12" fill="#7a4a1f">braun = GND</text>
<text x="860" y="136" font-size="12" fill="#d62828">rot = +5V</text>
<text x="860" y="154" font-size="12" fill="#f08c00">orange = Signal</text>
